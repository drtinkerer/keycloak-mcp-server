apiVersion: v1
kind: Secret
metadata:
  name: keycloak-mcp-server-secrets
  labels:
    app: keycloak-mcp-server
    component: mcp-server
type: Opaque
stringData:
  # Generate once and keep stable: it signs MCP tokens and encrypts stored
  # Keycloak tokens. uv run python -c 'import secrets; print(secrets.token_urlsafe(48))'
  KEYCLOAK_OAUTH_SIGNING_KEY: "CHANGE_ME"
  # Only for a confidential Keycloak client:
  # KEYCLOAK_OAUTH_CLIENT_SECRET: ""
