apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-mcp-server
  labels:
    app: keycloak-mcp-server
    component: mcp-server
spec:
  # OAuth state lives on a ReadWriteOnce volume: run a single replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-mcp-server
      component: mcp-server
  template:
    metadata:
      labels:
        app: keycloak-mcp-server
        component: mcp-server
    spec:
      containers:
        - name: keycloak-mcp-server
          image: keycloak-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: keycloak-mcp-server-config
            - secretRef:
                name: keycloak-mcp-server-secrets
          volumeMounts:
            - name: oauth-state
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: oauth-state
          persistentVolumeClaim:
            claimName: keycloak-mcp-server-oauth
      restartPolicy: Always
