[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keycloak_mcp_server"]

[project]
name = "keycloak-mcp-server"
version = "0.1.1"
description = "Keycloak MCP server that calls the Admin API as the signed-in user, via OAuth"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Bhushan Rane"}]
keywords = ["mcp", "keycloak", "oauth", "fastmcp", "model-context-protocol", "iam"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    # Ranges, not pins: uvx/pip resolve these; uv.lock pins CI and dev.
    # fastmcp is capped tightly because the OAuth proxy subclass uses its internals.
    "fastmcp>=3.4.8,<3.5",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "structlog>=25.4.0",
    "python-dotenv>=1.1.1,<2",
    "fastapi>=0.143.0",
    "uvicorn>=0.35.0",
    "python-keycloak>=7.1.1,<8",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.2",
    "mypy==1.16.1",
    "pre-commit==4.2.0",
    "httpx==0.28.1",
    "langchain-google-genai==2.1.8",
    "langchain_mcp_adapters==0.1.8",
    "langgraph==0.5.4",
    "bandit==1.9.4",
    "safety",
    "pydocstyle"
]

[project.scripts]
keycloak-mcp-server = "keycloak_mcp_server.src.main:main"

[project.urls]
Homepage = "https://github.com/drtinkerer/keycloak-mcp-server"
Repository = "https://github.com/drtinkerer/keycloak-mcp-server"
Issues = "https://github.com/drtinkerer/keycloak-mcp-server/issues"
Changelog = "https://github.com/drtinkerer/keycloak-mcp-server/releases"

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["E", "W", "F", "I"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["keycloak_mcp_server"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = ["asyncio"]

[tool.coverage.run]
source = ["keycloak_mcp_server"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
