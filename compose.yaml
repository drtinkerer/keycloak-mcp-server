services:
  keycloak-mcp-server:
    build:
      context: .
      dockerfile: Containerfile
    container_name: keycloak-mcp-server
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=5001
    volumes:
      # Encrypted per-user OAuth state; losing it signs everyone out.
      - keycloak_oauth:/app/.keycloak-oauth
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  keycloak_oauth:
    driver: local
